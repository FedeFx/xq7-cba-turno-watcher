name: Monitor Citas Consulado

on:
  schedule:
    # GitHub no garantiza el intervalo: en la práctica corre cada ~60-90 min.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Loguear texto completo, URL, título y botones de la página'
        type: boolean
        default: false
      dry_run:
        description: 'No enviar notificaciones (solo loguearlas)'
        type: boolean
        default: false
      warp:
        description: 'Salir a internet por Cloudflare WARP (prueba contra el bloqueo)'
        type: boolean
        default: false

concurrency:
  group: monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get Playwright version
        id: pw
        run: echo "version=$(python -c "import importlib.metadata as m;print(m.version('playwright'))")" >> "$GITHUB_OUTPUT"

      # La caché queda atada a la versión exacta de Playwright: si cambia, se baja el Chromium nuevo.
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Siempre se ejecuta: con cache hit solo instala deps de sistema y verifica el navegador.
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      # Estado entre runs (contador de errores seguidos) para no spamear avisos de error.
      - name: Restore monitor state
        uses: actions/cache/restore@v5
        with:
          path: state.json
          key: monitor-state-${{ github.run_id }}
          restore-keys: monitor-state-

      # Opcional: sale por Cloudflare WARP en vez de la IP de Azure, para ver si evita el desafío anti-bots.
      # Se activa con el input "warp" (manual) o con la variable de repo USE_WARP=true (runs programados).
      - name: Connect Cloudflare WARP
        if: inputs.warp || vars.USE_WARP == 'true'
        continue-on-error: true
        run: |
          echo "IP antes: $(curl -s https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(ip|warp)=' | tr '\n' ' ')"
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -q && sudo apt-get install -y -q cloudflare-warp
          sudo systemctl start warp-svc || true
          for i in $(seq 1 15); do warp-cli --accept-tos status >/dev/null 2>&1 && break; sleep 2; done
          warp-cli --accept-tos registration new
          warp-cli --accept-tos connect
          for i in $(seq 1 15); do
            curl -s https://www.cloudflare.com/cdn-cgi/trace | grep -q '^warp=on' && break; sleep 2
          done
          warp-cli --accept-tos status
          echo "IP después: $(curl -s https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(ip|warp)=' | tr '\n' ' ')"

      - name: Run monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          DEBUG: ${{ inputs.debug && '1' || '' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python monitor.py

      - name: Disconnect Cloudflare WARP
        if: always() && (inputs.warp || vars.USE_WARP == 'true')
        continue-on-error: true
        run: warp-cli --accept-tos disconnect || true

      - name: Save monitor state
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v5
        with:
          path: state.json
          key: monitor-state-${{ github.run_id }}

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: diagnostico-${{ github.run_id }}
          path: |
            screenshot.png
            page.html
          if-no-files-found: ignore
          retention-days: 7
